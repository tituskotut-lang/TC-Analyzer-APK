name: Build TC Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract TC Analyzer project
        run: |
          mkdir -p buildsrc
          unzip -q TC_Analyzer_Real_APK_Build_Project_v25.zip -d buildsrc

          echo "=== Gradle project files ==="
          find buildsrc -name "settings.gradle" -o -name "settings.gradle.kts"

          echo "=== Build files ==="
          find buildsrc -name "build.gradle" -o -name "build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/buildsrc" -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build TC Analyzer APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --info

      - name: Find generated APK
        run: |
          echo "=== Searching for APK ==="
          find "$GITHUB_WORKSPACE/buildsrc" -type f -name "*.apk" -print

      - name: Upload TC Analyzer APK
        uses: actions/upload-artifact@v4
        with:
          name: TC-Analyzer-v25-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.8.22"
        }
    }
}
